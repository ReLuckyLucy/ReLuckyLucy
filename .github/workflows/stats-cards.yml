name: Update README cards

on:
  # 每周一凌晨 0 点（UTC）= 北京时间早上 8 点执行
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 升级到 v5 以适配 Node.js 24 运行环境
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SVG files
        run: |
          ls -la profile/
          if [ ! -s profile/stats.svg ]; then
            echo "❌ stats.svg is missing or empty!"
            exit 1
          fi
          if [ ! -s profile/top-langs.svg ]; then
            echo "❌ top-langs.svg is missing or empty!"
            exit 1
          fi
          echo "✅ Both SVG files generated successfully"

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || echo "No changes to commit"
          git push
