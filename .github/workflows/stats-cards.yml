name: Update README cards

on:
  # 每周一凌晨 0 点（UTC）= 北京时间早上 8 点执行，避免刷屏贡献图
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# 关键修正点：为工作流添加写入权限 + API 读取权限（修复"Resource not accessible by integration"）
permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 修复1：升级到 v5 以消除 Node.js 20 弃用警告
      # 修复2：显式传入 token，确保后续 git push 有认证权限
      # 修复3：fetch-depth: 0，完整 git 历史，避免 push 冲突
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 修复4：添加验证步骤，防止 SVG 生成失败被静默忽略
      - name: Verify SVG files
        run: |
          ls -la profile/
          if [ ! -s profile/stats.svg ]; then
            echo "ERROR: stats.svg is missing or empty!"
            exit 1
          fi
          if [ ! -s profile/top-langs.svg ]; then
            echo "ERROR: top-langs.svg is missing or empty!"
            exit 1
          fi
          echo "Both SVG files generated successfully"

      # 修复5：去掉 || exit 0，让真正的错误暴露出来
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || echo "No changes to commit"
          git push
