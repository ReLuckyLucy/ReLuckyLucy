name: Update README cards

on:
  schedule:
    - cron: "0 0 * * 1"          # 每周一 UTC 0:00（北京时间 8:00）自动执行
  workflow_dispatch:             # 允许手动触发

# 权限（保留 write 权限用于 push，但实际认证改用 PAT）
permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库（使用 PAT 认证）
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}   # 使用个人访问令牌
          fetch-depth: 0                    # 拉取完整历史，避免 push 冲突

      # 2. 生成统计卡片（stats）
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}   # 使用 PAT 调用 API

      # 3. 生成语言占比卡片（top-langs）
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}   # 使用 PAT 调用 API

      # 4. 验证 SVG 文件（检查是否生成错误信息）
      - name: Verify SVG files
        run: |
          ls -la profile/
          for file in profile/stats.svg profile/top-langs.svg; do
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is missing or empty!"
              exit 1
            fi
            # 检测常见错误关键词
            if grep -q -E "Something went wrong|Resource not accessible|rate limit" "$file"; then
              echo "ERROR: $file contains an error message!"
              echo "--- Content of $file (first 10 lines) ---"
              head -n 10 "$file"
              exit 1
            fi
          done
          echo "✅ Both SVG files are valid."

      # 5. 提交并推送卡片（只有内容变化时才会提交）
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || echo "No changes to commit"
          git push
